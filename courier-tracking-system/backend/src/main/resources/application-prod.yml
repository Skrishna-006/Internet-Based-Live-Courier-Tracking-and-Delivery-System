server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

spring:
  application:
    name: courier-tracking-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000
      data-source-properties:
        sslmode: ${DB_SSL_MODE:require}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  name: "Internet-Based Live Courier Tracking and Delivery System"
  version: "1.0.0"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  pricing:
    base-rate: ${APP_PRICING_BASE_RATE:10.00}
    per-kg-rate: ${APP_PRICING_PER_KG_RATE:5.00}
    currency: ${APP_PRICING_CURRENCY:USD}
    min-price: ${APP_PRICING_MIN_PRICE:10.00}
  otp:
    expose-in-response: false
